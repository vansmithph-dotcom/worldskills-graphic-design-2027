<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Текст и форма в одном знаке — порядок действий</title>
  <desc id="desc">Инфографика занятия «Текст и форма в одном знаке». Исследуй характер названия: Начни с точного написания и читаемого словесного знака. Соедини текст и графическую форму: Найди смысловую связь между буквами, знаком и свободной формой. Проверь читаемость и масштаб: Сравни совместную, раздельную и компактную версии на носителях. Этап 1: Исследуй характер названия. Начни с точного написания и читаемого словесного знака. Этап 2: Соедини текст и графическую форму. Найди смысловую связь между буквами, знаком и свободной формой. Этап 3: Проверь читаемость и масштаб. Сравни совместную, раздельную и компактную версии на носителях. Сначала выполни каждый этап по порядку; переходи к следующему только после короткой проверки предыдущего.</desc>
  <style>
    .bg{fill:#f7f4ed}.eyebrow{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#256b62}.title{font:700 27px Arial,sans-serif;fill:#172c38}.step-card{fill:#fff;stroke:#d6d5cc;stroke-width:2}.step-number{font:700 16px Arial,sans-serif;fill:#fff}.step-label{font:700 18px Arial,sans-serif;fill:#172c38}.step-detail{font:400 14px Arial,sans-serif;fill:#42535b}.micro{font:700 9px Arial,sans-serif;letter-spacing:1px;fill:#647078}.arrow{stroke:#79848a;stroke-width:3;stroke-linecap:round}.arrow-head{fill:none;stroke:#79848a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.caption{font:400 15px Arial,sans-serif;fill:#42535b}
  </style>
  <rect class="bg" x="0" y="0" width="1280" height="520" rx="22"/>
  <text x="54" y="52" class="eyebrow">ПРОЦЕСС ЗАНЯТИЯ</text>
  <text x="54" y="100" class="title">Текст и форма в одном знаке</text>
  <g aria-label="Этап 1: Исследуй характер названия Начни с точного написания и читаемого словесного знака.">
      <rect x="95" y="158" width="330" height="250" rx="18" class="step-card"/>
      <path d="M 113 158 H 407 Q 425 158 425 176 V 168 H 95 V 176 Q 95 158 113 158 Z" fill="#256b62"/>
      <circle cx="137" cy="204" r="19" fill="#256b62"/>
      <text x="137" y="211" text-anchor="middle" class="step-number">1</text>
      <text x="260" y="248" text-anchor="middle" class="step-label">Исследуй характер</text>
<text x="260" y="276" text-anchor="middle" class="step-label">названия</text>
      <text x="260" y="316" text-anchor="middle" class="step-detail">Начни с точного написания и</text>
<text x="260" y="335" text-anchor="middle" class="step-detail">читаемого словесного знака.</text>
      <text x="260" y="386" text-anchor="middle" class="micro">СДЕЛАЙ · ПРОВЕРЬ · ПРОДОЛЖАЙ</text>
    </g><path d="M 435 280 H 463" class="arrow"/><path d="M 451 270 L 463 280 L 451 290" class="arrow-head"/>
<g aria-label="Этап 2: Соедини текст и графическую форму Найди смысловую связь между буквами, знаком и свободной формой.">
      <rect x="475" y="158" width="330" height="250" rx="18" class="step-card"/>
      <path d="M 493 158 H 787 Q 805 158 805 176 V 168 H 475 V 176 Q 475 158 493 158 Z" fill="#cb6a43"/>
      <circle cx="517" cy="204" r="19" fill="#cb6a43"/>
      <text x="517" y="211" text-anchor="middle" class="step-number">2</text>
      <text x="640" y="248" text-anchor="middle" class="step-label">Соедини текст и</text>
<text x="640" y="276" text-anchor="middle" class="step-label">графическую форму</text>
      <text x="640" y="316" text-anchor="middle" class="step-detail">Найди смысловую связь между буквами,</text>
<text x="640" y="335" text-anchor="middle" class="step-detail">знаком и свободной формой.</text>
      <text x="640" y="386" text-anchor="middle" class="micro">СДЕЛАЙ · ПРОВЕРЬ · ПРОДОЛЖАЙ</text>
    </g><path d="M 815 280 H 843" class="arrow"/><path d="M 831 270 L 843 280 L 831 290" class="arrow-head"/>
<g aria-label="Этап 3: Проверь читаемость и масштаб Сравни совместную, раздельную и компактную версии на носителях.">
      <rect x="855" y="158" width="330" height="250" rx="18" class="step-card"/>
      <path d="M 873 158 H 1167 Q 1185 158 1185 176 V 168 H 855 V 176 Q 855 158 873 158 Z" fill="#5e6ba7"/>
      <circle cx="897" cy="204" r="19" fill="#5e6ba7"/>
      <text x="897" y="211" text-anchor="middle" class="step-number">3</text>
      <text x="1020" y="248" text-anchor="middle" class="step-label">Проверь читаемость и</text>
<text x="1020" y="276" text-anchor="middle" class="step-label">масштаб</text>
      <text x="1020" y="316" text-anchor="middle" class="step-detail">Сравни совместную, раздельную и</text>
<text x="1020" y="335" text-anchor="middle" class="step-detail">компактную версии на носителях.</text>
      <text x="1020" y="386" text-anchor="middle" class="micro">СДЕЛАЙ · ПРОВЕРЬ · ПРОДОЛЖАЙ</text>
    </g>
  <path d="M 54 438 H 1226" stroke="#d6d5cc" stroke-width="2"/>
  <text x="54" y="475" class="caption">Сначала выполни каждый этап по порядку; переходи к следующему только после короткой проверки предыдущего.</text>
</svg>
