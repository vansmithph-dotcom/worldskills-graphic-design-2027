<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Собранный рукав «Первый оттиск»</title><desc id="desc">Учебный объёмный эскиз бумажного рукава вокруг коробки. На лицевой панели находятся название и метка аудитории, сбоку виден шов.</desc><style>.bg{fill:#f3f0e7}.front{fill:#fffdf7}.side{fill:#e7d6bf}.top{fill:#efe6d8}.ink{fill:#172c38}.accent{fill:#b13d2e}.muted{fill:#5e6d72}.head{font:700 31px Arial,sans-serif}.small{font:700 15px Arial,sans-serif}.copy{font:15px Arial,sans-serif}</style><rect class="bg" width="1000" height="540"/><text x="46" y="47" class="ink small">УЧЕБНЫЙ ОБРАЗЕЦ · СОБРАННЫЙ РУКАВ</text><path d="M220 168 590 168 690 224 320 224Z" class="top" stroke="#172c38" stroke-width="3"/><path d="M220 168H590V390H220Z" class="front" stroke="#172c38" stroke-width="3"/><path d="M590 168 690 224V446L590 390Z" class="side" stroke="#172c38" stroke-width="3"/><text x="270" y="246" class="ink head">Первый</text><text x="270" y="286" class="ink head">оттиск</text><path d="M270 310h230" stroke="#b13d2e" stroke-width="5"/><text x="270" y="347" class="muted copy">Набор для вводной мастерской</text><rect x="464" y="326" width="70" height="38" rx="19" class="accent"/><text x="480" y="351" fill="#fffdf7" class="small">16+</text><path d="M590 168v222" stroke="#276b79" stroke-width="4" stroke-dasharray="9 7"/><text x="608" y="285" class="ink small" transform="rotate(90 608 285)">СГИБ · ШОВ НА ЗАДНЕЙ СТОРОНЕ</text><path d="M220 423h370M220 416v14M590 416v14" stroke="#172c38" stroke-width="2"/><text x="355" y="451" class="ink small">100 мм · лицевая панель</text><text x="46" y="500" class="muted copy">Собери бумажный вариант 1:1 и проверь посадку вокруг макета 100 × 65 × 25 мм.</text></svg>