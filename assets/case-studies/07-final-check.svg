<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Проверка требований и доказательств</title><desc id="desc">Каждая строка брифа связана с файлом, проверкой и открытым вопросом; непроверенное не отмечается готовым.</desc><style>.bg{fill:#f3f0e7}.paper{fill:#fffdf7}.ink{fill:#172c38}.muted{fill:#5e6d72}.ok{fill:#205d55}.warn{fill:#a84532}.head{font:700 22px Arial,sans-serif}.copy{font:15px Arial,sans-serif}.small{font:700 13px Arial,sans-serif}</style><rect class="bg" width="1000" height="520"/><text x="42" y="45" class="ink head">ТРЕБОВАНИЕ → ДОКАЗАТЕЛЬСТВО → СТАТУС</text><rect x="42" y="82" width="916" height="360" rx="10" class="paper" stroke="#172c38" stroke-width="2"/><path d="M42 136h916M330 82v360M662 82v360" stroke="#172c38" stroke-width="2"/><text x="62" y="116" class="ink small">БРИФ</text><text x="350" y="116" class="ink small">ФАЙЛ / ФРАГМЕНТ</text><text x="682" y="116" class="ink small">ПРОВЕРКА</text><g transform="translate(0 0)"><text x="62" y="178" class="ink copy">Название</text><text x="350" y="178" class="ink copy">identity.ai · артборд 1</text><text x="682" y="178" class="ok small">открыто</text></g><g transform="translate(0 96)"><text x="62" y="178" class="ink copy">Экспорт PDF</text><text x="350" y="178" class="ink copy">sleeve-v02.pdf</text><text x="682" y="178" class="ok small">открыто</text></g><g transform="translate(0 192)"><text x="62" y="178" class="ink copy">Права на фото</text><text x="350" y="178" class="ink copy">rights/origin.txt</text><text x="682" y="178" class="warn small">уточнить</text></g><text x="42" y="484" class="muted copy">Не отмечай «готово», пока не открыл файл, которому соответствует эта строка.</text></svg>