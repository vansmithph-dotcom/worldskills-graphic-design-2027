<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Шесть доказательств навыков и два следующих упражнения</title><desc id="desc">Нейтральная учебная карта связывает шесть направлений с файлом или наблюдаемым действием и персональным шагом повторения, без общего рейтинга.</desc><style>.bg{fill:#f3f0e7}.paper{fill:#fffdf7}.ink{fill:#172c38}.muted{fill:#5e6d72}.green{fill:#205d55}.accent{fill:#b13d2e}.head{font:700 21px Arial,sans-serif}.copy{font:15px Arial,sans-serif}.small{font:700 13px Arial,sans-serif}</style><rect class="bg" width="1000" height="520"/><text x="42" y="46" class="ink head">НАВЫК → ДОКАЗАТЕЛЬСТВО → СЛЕДУЮЩАЯ ПРАКТИКА</text><g transform="translate(45 88)"><rect width="270" height="122" rx="12" class="paper" stroke="#172c38" stroke-width="2"/><text x="18" y="34" class="green small">1 · Бриф</text><text x="18" y="67" class="ink copy">Доказательство: локальный файл</text><text x="18" y="96" class="muted copy">Следующий шаг — повторная проба</text></g><g transform="translate(355 88)"><rect width="270" height="122" rx="12" class="paper" stroke="#172c38" stroke-width="2"/><text x="18" y="34" class="green small">2 · Типографика</text><text x="18" y="67" class="ink copy">Доказательство: локальный файл</text><text x="18" y="96" class="muted copy">Следующий шаг — повторная проба</text></g><g transform="translate(665 88)"><rect width="270" height="122" rx="12" class="paper" stroke="#172c38" stroke-width="2"/><text x="18" y="34" class="green small">3 · Знак</text><text x="18" y="67" class="ink copy">Доказательство: локальный файл</text><text x="18" y="96" class="muted copy">Следующий шаг — повторная проба</text></g><g transform="translate(45 244)"><rect width="270" height="122" rx="12" class="paper" stroke="#172c38" stroke-width="2"/><text x="18" y="34" class="green small">4 · Photoshop</text><text x="18" y="67" class="ink copy">Доказательство: локальный файл</text><text x="18" y="96" class="muted copy">Следующий шаг — повторная проба</text></g><g transform="translate(355 244)"><rect width="270" height="122" rx="12" class="paper" stroke="#172c38" stroke-width="2"/><text x="18" y="34" class="green small">5 · InDesign</text><text x="18" y="67" class="ink copy">Доказательство: локальный файл</text><text x="18" y="96" class="muted copy">Следующий шаг — повторная проба</text></g><g transform="translate(665 244)"><rect width="270" height="122" rx="12" class="paper" stroke="#172c38" stroke-width="2"/><text x="18" y="34" class="green small">6 · Передача файла</text><text x="18" y="67" class="ink copy">Доказательство: локальный файл</text><text x="18" y="96" class="muted copy">Следующий шаг — повторная проба</text></g><text x="45" y="442" class="accent small">ЛИЧНЫЙ РАЗБОР · НЕ ПУБЛИЧНЫЙ РЕЙТИНГ</text><text x="45" y="478" class="muted copy">Сохрани исходную и повторную попытку для сравнения по одному критерию.</text></svg>