<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Метки must, should, may и do not в учебном брифе</title><desc id="desc">Английские строки разобраны на обязательное действие, рекомендацию, разрешение, число с единицей и явное отрицание.</desc><style>.bg{fill:#f3f0e7}.paper{fill:#fffdf7}.ink{fill:#172c38}.muted{fill:#5e6d72}.red{fill:#b13d2e}.blue{fill:#276b79}.green{fill:#205d55}.head{font:700 21px Arial,sans-serif}.copy{font:16px Arial,sans-serif}.small{font:700 13px Arial,sans-serif}</style><rect class="bg" width="1000" height="520"/><text x="42" y="46" class="ink head">АНГЛИЙСКИЙ БРИФ · НАЙДИ СИЛУ ТРЕБОВАНИЯ</text><rect x="42" y="82" width="916" height="346" rx="12" class="paper" stroke="#172c38" stroke-width="2"/><text x="72" y="133" class="red small">MUST · ОБЯЗАТЕЛЬНО</text><text x="346" y="133" class="ink copy">The artwork MUST be 120 mm wide.</text><text x="72" y="191" class="blue small">SHOULD · РЕКОМЕНДАЦИЯ</text><text x="346" y="191" class="ink copy">The layout SHOULD show the workshop audience.</text><text x="72" y="249" class="green small">MAY · РАЗРЕШЕНО</text><text x="346" y="249" class="ink copy">You MAY use one supplied image.</text><text x="72" y="307" class="red small">DO NOT · ЗАПРЕТ</text><text x="346" y="307" class="ink copy">Do not add an unconfirmed date.</text><rect x="72" y="351" width="205" height="42" rx="7" fill="#dce8df"/><text x="90" y="378" class="ink small">120 mm → точная единица</text><text x="42" y="480" class="muted copy">Оригинал остаётся рядом с рабочим переводом; неизвестное записывается вопросом.</text></svg>