<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">Вертикальная карточка учебного анонса</title><desc id="desc">Фотография вымышленного набора, заголовок и честная пометка о неподтверждённых дате и месте.</desc><style>.bg{fill:#f3f0e7}.ink{fill:#172c38}.muted{fill:#5e6d72}.paper{fill:#fffdf7}.accent{fill:#c34d33}.display{font:700 35px Arial,sans-serif}.copy{font:700 18px Arial,sans-serif}.small{font:700 13px Arial,sans-serif}</style><rect class="bg" width="1000" height="680"/><text x="45" y="45" class="ink small">УЧЕБНАЯ СИМУЛЯЦИЯ · ЦИФРОВОЙ АНОНС</text><rect x="280" y="70" width="440" height="550" rx="22" class="paper" stroke="#172c38" stroke-width="2"/><image href="linocut-stilllife.png" x="300" y="90" width="400" height="250" preserveAspectRatio="xMidYMid slice"/><text x="315" y="390" class="ink display">Первый</text><text x="315" y="432" class="ink display">оттиск</text><text x="315" y="470" class="muted copy">Первый опыт линогравюры · 16+</text><rect x="315" y="500" width="370" height="50" rx="8" fill="#f3e5d5"/><text x="330" y="530" class="ink small">Дата и место: уточнить у заказчика</text><rect x="315" y="568" width="220" height="34" rx="17" class="accent"/><text x="337" y="590" class="paper small">Способ записи — уточнить</text><text x="45" y="650" class="muted small">НЕТ ДАТЫ · АДРЕСА · QR-КОДА БЕЗ ПОДТВЕРЖДЕНИЯ</text></svg>