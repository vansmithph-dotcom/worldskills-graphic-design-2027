<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Учебная мини-симуляция: изменение условия на десятой минуте</title><desc id="desc">На десять минуте преподаватель снимает разрешение на фотографию; студент сохраняет обязательный текст, заменяет снимок векторной формой и проходит экспортную проверку.</desc><style>.bg{fill:#f3f0e7}.paper{fill:#fffdf7}.ink{fill:#172c38}.muted{fill:#5e6d72}.red{fill:#a84532}.green{fill:#205d55}.head{font:700 21px Arial,sans-serif}.copy{font:15px Arial,sans-serif}.small{font:700 13px Arial,sans-serif}</style><rect class="bg" width="1000" height="520"/><text x="42" y="46" class="ink head">25 МИНУТ · ПОЛНЫЙ ЦИКЛ МИНИ-БРИФА · НЕ ФОРМАТ ЧЕМПИОНАТА</text><path d="M120 176h760" stroke="#172c38" stroke-width="4"/><circle cx="120" cy="176" r="14" class="green"/><circle cx="424" cy="176" r="20" class="red"/><circle cx="728" cy="176" r="14" class="green"/><circle cx="880" cy="176" r="14" class="green"/><text x="90" y="130" class="ink small">0 · БРИФ</text><text x="378" y="130" class="red small">10 · НОВОЕ УСЛОВИЕ</text><text x="699" y="130" class="ink small">20 · ПРОВЕРКА</text><text x="849" y="130" class="ink small">25 · СДАЧА</text><rect x="88" y="228" width="330" height="130" rx="12" class="paper" stroke="#172c38" stroke-width="2"/><text x="112" y="269" class="ink small">ДО ИЗМЕНЕНИЯ</text><text x="112" y="308" class="muted copy">Фото пока разрешено</text><rect x="482" y="228" width="430" height="130" rx="12" fill="#172c38"/><text x="510" y="269" fill="#dcf17a" class="small">ПРАВА НА ФОТО НЕ ПОДТВЕРЖДЕНЫ</text><text x="510" y="308" fill="#fffdf7" class="copy">Замени снимок своим векторным мотивом</text><text x="42" y="435" class="green small">Сохрани название · возраст · дату «уточнить» · контрольные версии</text><text x="42" y="478" class="muted copy">Это педагогическая смена условия; Almaty 2027 требует официальной публикации условий.</text></svg>