<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Каркас короткой защиты идеи и вопрос о проблеме</title><desc id="desc">Пять коротких фраз объясняют аудиторию, задачу, решение, тест и вопрос; отдельный каркас сообщает имя файла, ожидаемое и фактическое поведение.</desc><style>.bg{fill:#f3f0e7}.paper{fill:#fffdf7}.ink{fill:#172c38}.muted{fill:#5e6d72}.green{fill:#205d55}.accent{fill:#b13d2e}.head{font:700 21px Arial,sans-serif}.copy{font:15px Arial,sans-serif}.small{font:700 13px Arial,sans-serif}</style><rect class="bg" width="1000" height="520"/><text x="42" y="46" class="ink head">SAY THE DESIGN · ASK FOR THE NEXT STEP</text><rect x="42" y="82" width="548" height="350" rx="14" class="paper" stroke="#172c38" stroke-width="2"/><text x="70" y="127" class="green small">45 SECONDS · 5 SHORT PARTS</text><text x="76" y="176" class="ink copy">1. The audience is…</text><text x="76" y="226" class="ink copy">2. The brief asks us to…</text><text x="76" y="276" class="ink copy">3. I chose… because…</text><text x="76" y="326" class="ink copy">4. I checked… I noticed… I changed…</text><text x="76" y="376" class="ink copy">5. Could you clarify whether…?</text><rect x="625" y="82" width="333" height="350" rx="14" fill="#172c38"/><text x="654" y="127" fill="#dcf17a" class="small">FILE ISSUE · 4 FACTS</text><text x="654" y="181" fill="#fffdf7" class="copy">File name</text><text x="654" y="228" fill="#fffdf7" class="copy">Expected result</text><text x="654" y="275" fill="#fffdf7" class="copy">What happened</text><text x="654" y="322" fill="#fffdf7" class="copy">What I checked</text><text x="654" y="369" fill="#fffdf7" class="copy">What I need</text><text x="42" y="481" class="muted copy">Понятность важнее акцента; проверяй тезисы по файлу и брифу.</text></svg>