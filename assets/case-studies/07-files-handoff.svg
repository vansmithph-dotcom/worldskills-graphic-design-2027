<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Дерево папок автономной передачи</title><desc id="desc">Учебный комплект отделяет исходники, ссылки, печатный и экранный экспорт, права и README; копия проверяется из новой папки без сети.</desc><style>.bg{fill:#f3f0e7}.paper{fill:#fffdf7}.ink{fill:#172c38}.muted{fill:#5e6d72}.green{fill:#205d55}.accent{fill:#b13d2e}.head{font:700 22px Arial,sans-serif}.copy{font:15px Arial,sans-serif}.small{font:700 13px Arial,sans-serif}</style><rect class="bg" width="1000" height="520"/><text x="42" y="46" class="ink head">КОПИЯ ПРОЕКТА, КОТОРУЮ МОЖНО ПЕРЕНЕСТИ</text><rect x="58" y="82" width="426" height="366" rx="14" class="paper" stroke="#172c38" stroke-width="2"/><text x="86" y="122" class="green small">first-imprint-handoff/</text><text x="100" y="167" class="ink copy">00-README.md</text><text x="100" y="209" class="ink copy">01-source/ identity.ai · workshop-card.psd</text><text x="100" y="251" class="ink copy">02-links/ linocut-stilllife.png</text><text x="100" y="293" class="ink copy">03-print/ sleeve-v02.pdf</text><text x="100" y="335" class="ink copy">04-screen/ promo-v02.jpg</text><text x="100" y="377" class="ink copy">05-rights/ image-origin.txt</text><path d="M516 264h100" stroke="#b13d2e" stroke-width="5" stroke-dasharray="9 7"/><rect x="648" y="126" width="296" height="278" rx="18" fill="#172c38"/><text x="680" y="174" fill="#dcf17a" class="small">ПРОВЕРКА ВНЕ СТАРОЙ ПАПКИ</text><text x="680" y="223" fill="#fffdf7" class="copy">Открыть ZIP</text><text x="680" y="265" fill="#fffdf7" class="copy">Отключить сеть</text><text x="680" y="307" fill="#fffdf7" class="copy">Открыть исходник</text><text x="680" y="349" fill="#fffdf7" class="copy">Сверить экспорты</text><text x="58" y="488" class="muted copy">Нет личных данных · связи локальные · версия обозначена в README</text></svg>