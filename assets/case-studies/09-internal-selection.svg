294" class="ink small">10 / 10</text><text x="70" y="336" class="ink copy">Объяснение · 10%</text><rect x="290" y="319" width="430" height="24" rx="5" fill="#e0e5df"/><rect x="290" y="319" width="322.5" height="24" rx="5" class="green"/><text x="760" y="337" class="ink small">7.5 / 10</text><rect x="42" y="428" width="916" height="48" rx="8" fill="#f2dfd6"/><text x="62" y="458" class="accent small">ВЫМЫШЛЕННАЯ РАБОТА · НЕ ПОРОГ И НЕ БАЛЛ WORLDSKILLS</text><text x="42" y="506" class="muted copy">Весы, шкала и правила берутся из опубликованной локальной рубрики без изменений.</text></svg>