<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Навигация четырёхстраничной памятки</title><desc id="desc">Четыре последовательные страницы памятки связаны ссылками из оглавления и повторяемым возвратом к началу.</desc><style>.bg{fill:#f3f0e7}.paper{fill:#fffdf7}.ink{fill:#172c38}.accent{fill:#205d55}.muted{fill:#5e6d72}.head{font:700 20px Arial,sans-serif}.copy{font:14px Arial,sans-serif}.small{font:700 12px Arial,sans-serif}</style><rect class="bg" width="1000" height="620"/><text x="38" y="44" class="ink small">УЧЕБНЫЙ ИНТЕРАКТИВНЫЙ PDF · СХЕМА ПЕРЕХОДОВ</text><g transform="translate(35 100)"><rect width="210" height="370" rx="10" class="paper" stroke="#172c38" stroke-width="2"/><rect width="210" height="56" rx="10" class="accent"/><text x="14" y="34" class="paper small">01 ОГЛАВЛЕНИЕ</text><text x="18" y="104" class="ink copy">Цель памятки</text><text x="18" y="146" class="ink copy">1. Подготовка</text><text x="18" y="188" class="ink copy">2. Первый оттиск</text><text x="18" y="230" class="ink copy">3. Завершение</text><rect x="18" y="270" width="174" height="54" rx="7" fill="#205d55"/><text x="32" y="302" class="paper small">К разделу 2</text><text x="18" y="350" class="muted small">СТРАНИЦА 1 ИЗ 4</text></g><g transform="translate(277 100)"><rect width="210" height="370" rx="10" class="paper" stroke="#172c38" stroke-width="2"/><rect width="210" height="56" rx="10" class="accent"/><text x="14" y="34" class="paper small">02 ПОДГОТОВКА</text><text x="18" y="108" class="ink head">Шаг 1</text><text x="18" y="144" class="muted copy">Короткое действие</text><text x="18" y="169" class="muted copy">и понятный результат.</text><rect x="18" y="270" width="174" height="54" rx="7" fill="#205d55"/><text x="32" y="302" class="paper small">К оглавлению</text><text x="18" y="350" class="muted small">СТРАНИЦА 2 ИЗ 4</text></g><g transform="translate(519 100)"><rect width="210" height="370" rx="10" class="paper" stroke="#172c38" stroke-width="2"/><rect width="210" height="56" rx="10" class="accent"/><text x="14" y="34" class="paper small">03 ПЕРВЫЙ ОТТИСК</text><text x="18" y="108" class="ink head">Шаг 2</text><text x="18" y="144" class="muted copy">Короткое действие</text><text x="18" y="169" class="muted copy">и понятный результат.</text><rect x="18" y="270" width="174" height="54" rx="7" fill="#205d55"/><text x="32" y="302" class="paper small">К оглавлению</text><text x="18" y="350" class="muted small">СТРАНИЦА 3 ИЗ 4</text></g><g transform="translate(761 100)"><rect width="210" height="370" rx="10" class="paper" stroke="#172c38" stroke-width="2"/><rect width="210" height="56" rx="10" class="accent"/><text x="14" y="34" class="paper small">04 ПОСЛЕ ЗАНЯТИЯ</text><text x="18" y="108" class="ink head">Шаг 3</text><text x="18" y="144" class="muted copy">Короткое действие</text><text x="18" y="169" class="muted copy">и понятный результат.</text><rect x="18" y="270" width="174" height="54" rx="7" fill="#205d55"/><text x="32" y="302" class="paper small">К оглавлению</text><text x="18" y="350" class="muted small">СТРАНИЦА 4 ИЗ 4</text></g><path d="M242 292h24M484 292h24M726 292h24" stroke="#c34d33" stroke-width="5" stroke-dasharray="7 6"/><text x="38" y="530" class="ink head">Без ссылок: заголовки и нумерация всё равно сохраняют порядок чтения.</text><text x="38" y="565" class="muted copy">Проверить каждый переход в экспортированном файле и нужном просмотрщике.</text></svg>