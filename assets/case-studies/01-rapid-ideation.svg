<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Три разные идеи за 15 минут — итог учебной симуляции</title><desc id="desc">Собственная схема задания «Первый оттиск». Показаны ключевые блоки для обсуждения; это учебный макет, не оригинал из опубликованного проекта и не конкурсное задание.</desc><style>.bg{fill:#f3f0e7}.card{fill:#fffdf7;stroke:#d5d3c8;stroke-width:2}.eyebrow{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#376c7c}.title{font:700 25px Arial,sans-serif;fill:#172c38}.label{font:700 14px Arial,sans-serif;fill:#172c38}.small{font:700 10px Arial,sans-serif;letter-spacing:1px;fill:#5f6b70}.light{font:700 11px Arial,sans-serif;letter-spacing:1px;fill:#fffdf7}</style><rect class="bg" width="1000" height="560" rx="20"/><text x="44" y="45" class="eyebrow">УЧЕБНАЯ СИМУЛЯЦИЯ · ПЕРВЫЙ ОТТИСК</text><text x="44" y="89" class="title">Три разные идеи за 15 минут</text><rect x="42" y="122" width="916" height="380" rx="18" class="card"/><g transform="translate(70 178)"><rect width="195" height="112" rx="12" fill="#fffdf7" stroke="#d5d3c8"/><text x="16" y="28" class="label">СЛЕД</text><path d="M18 48h60" stroke="#b83d2c" stroke-width="3" stroke-linecap="round"/><text x="18" y="87" class="small">ОТТИСК · МАКЕТ</text></g><g transform="translate(295 178)"><rect width="195" height="112" rx="12" fill="#eef2ed" stroke="#d5d3c8"/><text x="16" y="28" class="label">РИТУАЛ</text><path d="M18 48h73" stroke="#b83d2c" stroke-width="4" stroke-linecap="round"/><text x="18" y="87" class="small">ОТТИСК · МАКЕТ</text></g><g transform="translate(520 178)"><rect width="195" height="112" rx="12" fill="#fffdf7" stroke="#d5d3c8"/><text x="16" y="28" class="label">МАСТЕРСКАЯ</text><path d="M18 48h86" stroke="#b83d2c" stroke-width="5" stroke-linecap="round"/><text x="18" y="87" class="small">ОТТИСК · МАКЕТ</text></g><g transform="translate(760 208)"><rect width="170" height="170" rx="18" fill="#172c38"/><path d="M48 54H122V128H58V72" fill="none" stroke="#dcf17a" stroke-width="12" stroke-linejoin="round"/><circle cx="126" cy="54" r="8" fill="#b83d2c"/></g><text x="60" y="474" class="small">ПРИМЕР ВЫПОЛНЕНИЯ · ПРОВЕРЬ НА ФАКТИЧЕСКОМ НОСИТЕЛЕ</text></svg>