<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Разбор запуска набора «Первый оттиск» — итог учебной симуляции</title><desc id="desc">Собственная схема задания «Первый оттиск». Показаны ключевые блоки для обсуждения; это учебный макет, не оригинал из опубликованного проекта и не конкурсное задание.</desc><style>.bg{fill:#f3f0e7}.card{fill:#fffdf7;stroke:#d5d3c8;stroke-width:2}.eyebrow{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#376c7c}.title{font:700 25px Arial,sans-serif;fill:#172c38}.label{font:700 14px Arial,sans-serif;fill:#172c38}.small{font:700 10px Arial,sans-serif;letter-spacing:1px;fill:#5f6b70}.light{font:700 11px Arial,sans-serif;letter-spacing:1px;fill:#fffdf7}</style><rect class="bg" width="1000" height="560" rx="20"/><text x="44" y="45" class="eyebrow">УЧЕБНАЯ СИМУЛЯЦИЯ · ПЕРВЫЙ ОТТИСК</text><text x="44" y="89" class="title">Разбор запуска набора «Первый оттиск»</text><rect x="42" y="122" width="916" height="380" rx="18" class="card"/><g transform="translate(70 178)"><rect width="195" height="112" rx="12" fill="#fffdf7" stroke="#d5d3c8"/><text x="16" y="28" class="label">БРИФ</text><path d="M18 48h60" stroke="#b83d2c" stroke-width="3" stroke-linecap="round"/><text x="18" y="87" class="small">ОТТИСК · МАКЕТ</text></g><g transform="translate(295 178)"><rect width="195" height="112" rx="12" fill="#eef2ed" stroke="#d5d3c8"/><text x="16" y="28" class="label">ФАКТЫ</text><path d="M18 48h73" stroke="#b83d2c" stroke-width="4" stroke-linecap="round"/><text x="18" y="87" class="small">ОТТИСК · МАКЕТ</text></g><g transform="translate(520 178)"><rect width="195" height="112" rx="12" fill="#fffdf7" stroke="#d5d3c8"/><text x="16" y="28" class="label">ВОПРОСЫ</text><path d="M18 48h86" stroke="#b83d2c" stroke-width="5" stroke-linecap="round"/><text x="18" y="87" class="small">ОТТИСК · МАКЕТ</text></g><g transform="translate(760 168)"><rect width="175" height="205" rx="12" fill="#172c38"/><text x="18" y="32" class="light">ПРОВЕРИТЬ</text><rect x="18" y="54" width="138" height="27" rx="4" fill="#fffdf7"/><text x="28" y="72" class="small">ФАКТ</text><rect x="18" y="94" width="138" height="27" rx="4" fill="#fffdf7"/><text x="28" y="112" class="small">МЕСТО</text><rect x="18" y="134" width="138" height="27" rx="4" fill="#fffdf7"/><text x="28" y="152" class="small">ВОПРОС</text></g><text x="60" y="474" class="small">ПРИМЕР ВЫПОЛНЕНИЯ · ПРОВЕРЬ НА ФАКТИЧЕСКОМ НОСИТЕЛЕ</text></svg>