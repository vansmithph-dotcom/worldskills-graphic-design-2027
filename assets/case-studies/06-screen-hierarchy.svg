<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc"><title id="title">Экран анонса мастерской «Первый оттиск»</title><desc id="desc">Оригинальный учебный экран с названием, аудиторией, предупреждением, неизвестной датой и текстовой кнопкой следующего шага.</desc><style>.bg{fill:#f3f0e7}.ink{fill:#172c38}.muted{fill:#52656b}.paper{fill:#fffdf7}.accent{fill:#205d55}.title{font:700 32px Arial,sans-serif}.copy{font:18px Arial,sans-serif}.small{font:700 15px Arial,sans-serif}.tiny{font:13px Arial,sans-serif}</style><rect class="bg" width="900" height="740"/><text x="42" y="42" class="ink small">УЧЕБНЫЙ МАКЕТ · ШИРИНА 360 CSS PX</text><rect x="210" y="68" width="480" height="625" rx="28" fill="#172c38"/><rect x="225" y="85" width="450" height="590" rx="18" class="paper"/><rect x="225" y="85" width="450" height="58" rx="18" fill="#205d55"/><text x="250" y="122" class="paper small">МАСТЕРСКАЯ «ЛИНИЯ»</text><text x="258" y="210" class="ink title">Первый</text><text x="258" y="248" class="ink title">оттиск</text><text x="258" y="286" class="muted copy">Вводная мастерская по</text><text x="258" y="312" class="muted copy">линогравюре · 16+</text><rect x="258" y="344" width="384" height="92" rx="10" fill="#f3e5d5"/><text x="278" y="374" class="ink small">Перед началом</text><text x="278" y="402" class="ink tiny">Работа с инструментом — после</text><text x="278" y="422" class="ink tiny">инструктажа преподавателя.</text><text x="258" y="474" class="ink small">Дата и место: уточнить</text><text x="258" y="501" class="muted tiny">Поля не подтверждены заказчиком.</text><rect x="258" y="532" width="384" height="58" rx="10" class="accent"/><text x="286" y="568" class="paper small">Узнать о записи</text><text x="258" y="627" class="muted tiny">Кнопка-заглушка · адрес не задан</text><text x="42" y="720" class="ink small">ПРОВЕРЬ: СУТЬ · УСЛОВИЕ · НЕИЗВЕСТНОЕ · ДЕЙСТВИЕ</text></svg>