<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Содержание с внутренними переходами в PDF</title>
  <desc id="desc">Три подписанных пункта содержания ведут к соответствующим разделам на страницах два, три и четыре. Рядом показан список проверки ссылок, порядка чтения, другого просмотрщика и работы без сети.</desc>
  <rect width="960" height="520" rx="24" fill="#f7f4ed"/><text x="36" y="55" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#256b62">ВНУТРЕННИЕ ССЫЛКИ · ЭКСПОРТ · ПРОВЕРКА</text><text x="36" y="98" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172c38">Переход должен вести туда, куда обещает</text>
  <g font-family="Arial,sans-serif"><rect x="36" y="124" width="280" height="300" rx="14" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="58" y="158" font-size="13" font-weight="700" fill="#256b62">СТРАНИЦА 1 · СОДЕРЖАНИЕ</text><text x="58" y="194" font-size="21" font-weight="700" fill="#172c38">Памятка участника</text><g font-size="14" font-weight="700" fill="#172c38"><rect x="58" y="215" width="236" height="43" rx="8" fill="#e7eee9"/><text x="73" y="242">01 · Перед началом → 2</text><rect x="58" y="270" width="236" height="43" rx="8" fill="#e7eee9"/><text x="73" y="297">02 · Рабочий процесс → 3</text><rect x="58" y="325" width="236" height="43" rx="8" fill="#e7eee9"/><text x="73" y="352">03 · Финальная проверка → 4</text></g><text x="58" y="397" font-size="13" fill="#52616a">Подписанная область нажимается целиком.</text>
  <path d="M330 237C370 237 366 195 404 195M330 292h74M330 346c40 0 36 42 74 42" fill="none" stroke="#cb6a43" stroke-width="3"/><g fill="#cb6a43"><path d="m397 188 12 7-12 7z"/><path d="m397 285 12 7-12 7z"/><path d="m397 381 12 7-12 7z"/></g><g><rect x="420" y="150" width="160" height="88" rx="12" fill="#fff" stroke="#256b62" stroke-width="3"/><text x="440" y="182" font-size="13" font-weight="700" fill="#256b62">СТРАНИЦА 2</text><text x="440" y="211" font-size="16" font-weight="700" fill="#172c38">Перед началом</text><rect x="420" y="248" width="160" height="88" rx="12" fill="#fff" stroke="#256b62" stroke-width="3"/><text x="440" y="280" font-size="13" font-weight="700" fill="#256b62">СТРАНИЦА 3</text><text x="440" y="309" font-size="16" font-weight="700" fill="#172c38">Рабочий процесс</text><rect x="420" y="346" width="160" height="88" rx="12" fill="#fff" stroke="#256b62" stroke-width="3"/><text x="440" y="378" font-size="13" font-weight="700" fill="#256b62">СТРАНИЦА 4</text><text x="440" y="407" font-size="16" font-weight="700" fill="#172c38">Проверка</text></g>
  <rect x="608" y="124" width="316" height="310" rx="14" fill="#172c38"/><text x="632" y="162" font-size="14" font-weight="700" fill="#f3ce71">ПРОВЕРЬ ПОСЛЕ ЭКСПОРТА</text><g font-size="14" fill="#fff"><circle cx="638" cy="205" r="7" fill="#f3ce71"/><text x="657" y="210">цель каждой ссылки</text><circle cx="638" cy="247" r="7" fill="#f3ce71"/><text x="657" y="252">порядок чтения и возврат</text><circle cx="638" cy="289" r="7" fill="#f3ce71"/><text x="657" y="294">открытие в другом приложении</text><circle cx="638" cy="331" r="7" fill="#f3ce71"/><text x="657" y="336">работа внутренних ссылок офлайн</text></g><path d="M632 358h268" stroke="#52616a" stroke-width="2"/><text x="632" y="389" font-size="13" fill="#d2dade">Для внешней ссылки напечатай</text><text x="632" y="411" font-size="13" fill="#d2dade">адрес рядом с её названием.</text></g>
</svg>
