<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc"><title id="title">Цикл черновой печати, примерки и исправления</title><desc id="desc">Три этапа: распечатать в масштабе 100 процентов, собрать рукав вокруг размера 100 на 65 на 25 миллиметров, записать наблюдение и повторить тест после правки.</desc><style>.bg{fill:#f3f0e7}.paper{fill:#fffdf7}.ink{fill:#172c38}.muted{fill:#5e6d72}.accent{fill:#b13d2e}.green{fill:#205d55}.title{font:700 22px Arial,sans-serif}.copy{font:15px Arial,sans-serif}.small{font:700 13px Arial,sans-serif}</style><rect class="bg" width="1080" height="480"/><text x="42" y="44" class="ink title">ПРОБА → ФИЗИЧЕСКАЯ ПРИМЕРКА → ПОВТОРНАЯ ПРОВЕРКА</text><g transform="translate(42 92)"><rect width="300" height="260" rx="14" class="paper" stroke="#172c38" stroke-width="2"/><rect width="300" height="54" rx="14" class="green"/><text x="18" y="34" class="paper small">01 · ЧЕРНОВИК</text><rect x="48" y="84" width="205" height="100" fill="#eadcc6" stroke="#b13d2e" stroke-width="3"/><path d="M48 205h205" stroke="#172c38" stroke-width="2"/><text x="85" y="230" class="ink small">50 мм · контроль</text><text x="18" y="285" class="muted copy">A4 · 100% · Измерь контрольные 50 мм</text></g><g transform="translate(386 92)"><rect width="300" height="260" rx="14" class="paper" stroke="#172c38" stroke-width="2"/><rect width="300" height="54" rx="14" class="green"/><text x="18" y="34" class="paper small">02 · СБОРКА</text><path d="M55 112h190v100H55z" fill="#eadcc6" stroke="#b13d2e" stroke-width="3"/><path d="M150 112v100" stroke="#276b79" stroke-width="3" stroke-dasharray="8 6"/><text x="82" y="244" class="ink small">Шов и метка видны?</text><text x="18" y="285" class="muted copy">100 × 65 × 25 мм · Найди шов и сгиб</text></g><g transform="translate(730 92)"><rect width="300" height="260" rx="14" class="paper" stroke="#172c38" stroke-width="2"/><rect width="300" height="54" rx="14" class="green"/><text x="18" y="34" class="paper small">03 · ИСПРАВЛЕНИЕ</text><rect x="48" y="84" width="205" height="100" fill="#eadcc6" stroke="#b13d2e" stroke-width="3"/><text x="58" y="125" class="ink small">16+ → внутрь панели</text><path d="M48 205h205" stroke="#205d55" stroke-width="4"/><text x="73" y="238" class="ink small">Та же проверка снова</text><text x="18" y="285" class="muted copy">Один наблюдаемый сбой · Измени и проверь снова</text></g><path d="M346 223h38M690 223h38" stroke="#b13d2e" stroke-width="5" stroke-dasharray="8 6"/><text x="42" y="414" class="ink small">Учебная симуляция: пример наблюдения не является реальным опросом студентов.</text><text x="42" y="445" class="muted copy">Монохромный оттиск проверяет форму и текст, но не подтверждает цвет на конкретном картоне.</text></svg>