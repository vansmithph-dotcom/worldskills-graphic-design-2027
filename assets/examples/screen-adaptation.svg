<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Адаптация экранной композиции</title><desc id="desc">Вертикальная и квадратная афиши используют тот же заголовок и действие, но блоки меняют расположение.</desc><rect width="720" height="360" fill="#f3f0e7"/><text x="40" y="42" font-family="Arial" font-size="16" font-weight="700" fill="#172c38">СМЫСЛ СОХРАНЯЕТСЯ · КОМПОЗИЦИЯ МЕНЯЕТСЯ</text><g transform="translate(120 75)"><rect width="166" height="236" fill="#fffdf7" stroke="#172c38" stroke-width="2"/><rect x="18" y="20" width="130" height="54" fill="#dcf17a"/><text x="27" y="44" font-family="Arial" font-size="13" font-weight="700" fill="#172c38">ДЕНЬ</text><text x="27" y="62" font-family="Arial" font-size="13" font-weight="700" fill="#172c38">ПЕЧАТИ</text><rect x="18" y="88" width="130" height="83" fill="#457f91"/><circle cx="82" cy="129" r="25" fill="#df563d"/><rect x="18" y="187" width="92" height="7" fill="#172c38"/><rect x="18" y="205" width="130" height="18" fill="#df563d"/><text x="10" y="260" font-family="Arial" font-size="12" fill="#172c38">вертикаль</text></g><g transform="translate(410 92)"><rect width="210" height="210" fill="#fffdf7" stroke="#172c38" stroke-width="2"/><rect x="17" y="17" width="176" height="54" fill="#dcf17a"/><text x="27" y="41" font-family="Arial" font-size="13" font-weight="700" fill="#172c38">ДЕНЬ ПЕЧАТИ</text><rect x="17" y="85" width="84" height="86" fill="#457f91"/><circle cx="58" cy="128" r="25" fill="#df563d"/><rect x="114" y="91" width="79" height="7" fill="#172c38"/><rect x="114" y="110" width="79" height="7" fill="#172c38"/><rect x="17" y="185" width="176" height="15" fill="#df563d"/><text x="56" y="235" font-family="Arial" font-size="12" fill="#172c38">квадрат</text></g></svg>
