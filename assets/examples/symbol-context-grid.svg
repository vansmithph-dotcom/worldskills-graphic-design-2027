<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Один символ — разные прочтения в контексте</title>
  <desc id="desc">Три одинаковые звезды помещены в контекст награды, навигационной карты и ночного неба. Подписи показывают, что смысл возникает из формы, окружения и опыта зрителя, а не из универсального словаря символов.</desc>
  <rect width="1120" height="560" rx="28" fill="#f7f4ed"/>
  <text x="52" y="62" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#256b62">ФОРМА · КОНТЕКСТ · ПРОЧТЕНИЕ</text>
  <text x="52" y="112" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172c38">Одна звезда — не одно обещанное значение</text>
  <g transform="translate(52 155)">
    <rect width="318" height="310" rx="18" fill="#fff" stroke="#d6d5cc" stroke-width="2"/>
    <circle cx="160" cy="104" r="62" fill="#f6e8d0"/>
    <path d="M160 57 173 91 209 93 181 116 190 151 160 131 130 151 139 116 111 93 147 91Z" fill="#cb6a43"/>
    <path d="M137 180h46M146 193h28" stroke="#cb6a43" stroke-width="5" stroke-linecap="round"/>
    <text x="24" y="236" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#172c38">Награда или отличие</text>
    <text x="24" y="269" font-family="Arial,sans-serif" font-size="14" fill="#52616a">Рядом: лента, медаль, место в рейтинге</text>
  </g>
  <g transform="translate(401 155)">
    <rect width="318" height="310" rx="18" fill="#fff" stroke="#d6d5cc" stroke-width="2"/>
    <path d="M60 146 253 69 202 249 166 167Z" fill="#d9e8e2" stroke="#256b62" stroke-width="3" stroke-linejoin="round"/>
    <path d="m160 98 13 34 36 2-28 23 9 35-30-20-30 20 9-35-28-23 36-2Z" fill="#256b62"/>
    <path d="M173 139 245 78" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="24" y="236" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#172c38">Ориентир на карте</text>
    <text x="24" y="269" font-family="Arial,sans-serif" font-size="14" fill="#52616a">Рядом: направление, маршрут, отметка</text>
  </g>
  <g transform="translate(750 155)">
    <rect width="318" height="310" rx="18" fill="#172c38"/>
    <circle cx="160" cy="110" r="59" fill="#283f4b"/>
    <path d="M160 57 173 91 209 93 181 116 190 151 160 131 130 151 139 116 111 93 147 91Z" fill="#f3ce71"/>
    <circle cx="84" cy="74" r="3" fill="#fff"/><circle cx="230" cy="127" r="3" fill="#fff"/><circle cx="93" cy="148" r="2" fill="#fff"/><circle cx="222" cy="60" r="2" fill="#fff"/>
    <text x="24" y="236" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Ночное небо или мечта</text>
    <text x="24" y="269" font-family="Arial,sans-serif" font-size="14" fill="#d2dade">Рядом: ночь, созвездие, рассказ о будущем</text>
  </g>
  <text x="52" y="512" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b34f30">Проверь прочтение на нужной аудитории. Контекст меняет интерпретацию.</text>
</svg>
