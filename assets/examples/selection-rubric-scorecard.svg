<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Внутренняя рубрика: веса и опорные уровни</title>
  <desc id="desc">Шесть критериев внутреннего учебного отбора имеют веса от 10 до 25 процентов. Каждый оценивается по наблюдаемому доказательству на уровне 0, 25, 50, 75 или 100 процентов своего веса; три технических условия и правило дополнительной пробы показаны отдельно.</desc>
  <rect width="960" height="500" rx="24" fill="#f7f4ed"/><text x="36" y="53" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#256b62">ВНУТРЕННИЙ ПРОЕКТ · НЕ РЕГЛАМЕНТ WSI</text><text x="36" y="94" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172c38">Вес × доказательство × уровень выполнения</text>
  <g font-family="Arial,sans-serif"><rect x="36" y="116" width="888" height="44" rx="9" fill="#172c38"/><text x="55" y="144" font-size="13" font-weight="700" fill="#f3ce71">КРИТЕРИЙ</text><text x="355" y="144" font-size="13" font-weight="700" fill="#f3ce71">ВЕС</text><text x="450" y="144" font-size="13" font-weight="700" fill="#f3ce71">ДОЛЯ ВЕСА: 0 · 25 · 50 · 75 · 100%</text><g font-size="13"><g fill="#172c38"><rect x="36" y="169" width="888" height="35" rx="7" fill="#fff" stroke="#d6d5cc"/><rect x="36" y="209" width="888" height="35" rx="7" fill="#fff" stroke="#d6d5cc"/><rect x="36" y="249" width="888" height="35" rx="7" fill="#fff" stroke="#d6d5cc"/><rect x="36" y="289" width="888" height="35" rx="7" fill="#fff" stroke="#d6d5cc"/><rect x="36" y="329" width="888" height="35" rx="7" fill="#fff" stroke="#d6d5cc"/><rect x="36" y="369" width="888" height="35" rx="7" fill="#fff" stroke="#d6d5cc"/></g><g fill="#172c38"><text x="55" y="192">Бриф и аудитория</text><text x="55" y="232">Идея и визуальное решение</text><text x="55" y="272">Иерархия и композиция</text><text x="55" y="312">Техника и качество вывода</text><text x="55" y="352">Время и файлы</text><text x="55" y="392">Объяснение решения</text></g><g font-weight="700" fill="#256b62"><text x="365" y="192">15%</text><text x="365" y="232">20%</text><text x="365" y="272">20%</text><text x="365" y="312">25%</text><text x="365" y="352">10%</text><text x="365" y="392">10%</text></g><g fill="#f1ddd5"><circle cx="475" cy="187" r="10"/><circle cx="475" cy="227" r="10"/><circle cx="475" cy="267" r="10"/><circle cx="475" cy="307" r="10"/><circle cx="475" cy="347" r="10"/><circle cx="475" cy="387" r="10"/></g><g fill="#e6ebf6"><circle cx="535" cy="187" r="10"/><circle cx="535" cy="227" r="10"/><circle cx="535" cy="267" r="10"/><circle cx="535" cy="307" r="10"/><circle cx="535" cy="347" r="10"/><circle cx="535" cy="387" r="10"/></g><g fill="#d9e8e2"><circle cx="595" cy="187" r="10"/><circle cx="595" cy="227" r="10"/><circle cx="595" cy="267" r="10"/><circle cx="595" cy="307" r="10"/><circle cx="595" cy="347" r="10"/><circle cx="595" cy="387" r="10"/></g><g fill="#f3ce71"><circle cx="655" cy="187" r="10"/><circle cx="655" cy="227" r="10"/><circle cx="655" cy="267" r="10"/><circle cx="655" cy="307" r="10"/><circle cx="655" cy="347" r="10"/><circle cx="655" cy="387" r="10"/></g><g fill="#bdd4ca"><circle cx="715" cy="187" r="10"/><circle cx="715" cy="227" r="10"/><circle cx="715" cy="267" r="10"/><circle cx="715" cy="307" r="10"/><circle cx="715" cy="347" r="10"/><circle cx="715" cy="387" r="10"/></g><g text-anchor="middle" font-size="10" font-weight="700" fill="#172c38"><text x="475" y="191">0</text><text x="535" y="191">25</text><text x="595" y="191">50</text><text x="655" y="191">75</text><text x="715" y="191">100</text></g><text x="758" y="192" fill="#52616a">запиши файл, факт</text><text x="758" y="212" fill="#52616a">или ответ как опору</text></g>
  <rect x="36" y="422" width="888" height="58" rx="10" fill="#172c38"/><text x="54" y="448" font-size="12" font-weight="700" fill="#f3ce71">ТЕХНИЧЕСКИЕ УСЛОВИЯ</text><text x="245" y="448" font-size="12" fill="#fff">исходник открывается · сообщение на месте · экспорт по брифу</text><text x="54" y="468" font-size="12" fill="#d2dade">Разница ≤ 3 баллов: одна дополнительная проба; итог 50/50; повтор после учебного блока, если разница сохраняется.</text></g>
</svg>
