<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Короткое объяснение дизайн-решения</title>
  <desc id="desc">Плакат учебного фестиваля связан с тремя фразами на английском: кому он помогает, какое визуальное решение выбрано и каким тестом проверена читаемость даты.</desc>
  <rect width="960" height="470" rx="24" fill="#f7f4ed"/><text x="36" y="53" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#256b62">FOR · I CHOSE · I CHECKED</text><text x="36" y="94" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172c38">Объясни выбор через доказательство</text>
  <g font-family="Arial,sans-serif"><rect x="36" y="116" width="250" height="310" rx="14" fill="#172c38"/><text x="58" y="151" font-size="12" font-weight="700" fill="#f3ce71">УЧЕБНЫЙ ПЛАКАТ</text><text x="58" y="203" font-size="27" font-weight="700" fill="#fff">ФЕСТИВАЛЬ</text><text x="58" y="239" font-size="27" font-weight="700" fill="#fff">ИДЕЙ</text><path d="M58 260h205" stroke="#cb6a43" stroke-width="4"/><circle cx="100" cy="307" r="18" fill="#f3ce71"/><circle cx="153" cy="307" r="18" fill="#256b62"/><circle cx="206" cy="307" r="18" fill="#cb6a43"/><text x="58" y="359" font-size="15" font-weight="700" fill="#fff">12 мая · колледж</text><text x="58" y="389" font-size="12" fill="#d2dade">Дата остаётся заметной</text><text x="58" y="408" font-size="12" fill="#d2dade">в уменьшенном формате.</text>
  <rect x="316" y="116" width="608" height="88" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="338" y="147" font-size="13" font-weight="700" fill="#256b62">1 · ЦЕЛЬ И АУДИТОРИЯ</text><text x="338" y="179" font-size="15" fill="#172c38">For new students, the poster makes the date easy to find.</text><rect x="316" y="216" width="608" height="88" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="338" y="247" font-size="13" font-weight="700" fill="#256b62">2 · ВЫБОР И ПРИЧИНА</text><text x="338" y="279" font-size="15" fill="#172c38">I used a large heading to create hierarchy.</text><rect x="316" y="316" width="608" height="88" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="338" y="347" font-size="13" font-weight="700" fill="#256b62">3 · ПРОВЕРЕННОЕ ДОКАЗАТЕЛЬСТВО</text><text x="338" y="379" font-size="15" fill="#172c38">I checked it at phone size; the date stayed readable.</text><text x="338" y="426" font-size="12" fill="#52616a">Про тест говори только если ты действительно его провёл.</text></g>
</svg>
