<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Проверка учебного фотокомпозита</title>
  <desc id="desc">Фотография стакана чая помещается на фон с поверхностью. Выноски показывают край маски, контактную тень, направление света и общий тон; внизу перечислена проверка размера и файлового вывода.</desc>
  <rect width="960" height="520" rx="24" fill="#f7f4ed"/><text x="36" y="55" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#256b62">МАСКА · ПЕРСПЕКТИВА · СВЕТ · ВЫВОД</text><text x="36" y="98" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172c38">Собери предмет и фон в одну сцену</text>
  <g font-family="Arial,sans-serif"><rect x="36" y="124" width="205" height="253" rx="14" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="56" y="159" font-size="13" font-weight="700" fill="#256b62">ИСХОДНИКИ</text><rect x="56" y="178" width="165" height="76" rx="8" fill="#d9e8e2"/><path d="M56 233 102 195 133 233 168 187 221 233v21H56Z" fill="#256b62"/><text x="56" y="277" font-size="14" font-weight="700" fill="#172c38">Фон и поверхность</text><rect x="56" y="293" width="165" height="64" rx="8" fill="#f3ce71"/><path d="M115 302h47l-5 43q-18 10-36 0Z" fill="#cb6a43"/><rect x="125" y="298" width="27" height="8" rx="4" fill="#172c38"/><text x="56" y="371" font-size="13" font-weight="700" fill="#172c38">Предмет для маски</text>
  <path d="M261 249h45" stroke="#cb6a43" stroke-width="4"/><path d="m299 241 14 8-14 8z" fill="#cb6a43"/><rect x="326" y="124" width="328" height="253" rx="14" fill="#fff" stroke="#256b62" stroke-width="3"/><text x="348" y="159" font-size="13" font-weight="700" fill="#256b62">КОМПОЗИТ В МАКЕТЕ</text><rect x="348" y="178" width="284" height="176" rx="8" fill="#d9e8e2"/><path d="M348 300 411 248 462 287 519 218 632 301v53H348Z" fill="#256b62"/><circle cx="585" cy="214" r="22" fill="#f3ce71"/><path d="M377 319h230" stroke="#52616a" stroke-width="8" opacity=".4" stroke-linecap="round"/><path d="M478 242h43l-5 71q-16 12-32 0Z" fill="#cb6a43" stroke="#f7f4ed" stroke-width="3"/><rect x="487" y="234" width="25" height="10" rx="4" fill="#172c38"/><text x="490" y="345" font-size="12" font-weight="700" fill="#172c38">маска + контактная тень</text>
  <path d="M670 230h44" stroke="#cb6a43" stroke-width="3"/><rect x="732" y="124" width="192" height="112" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="750" y="154" font-size="13" font-weight="700" fill="#256b62">КРАЙ МАСКИ</text><path d="M752 190h55" stroke="#256b62" stroke-width="14" stroke-linecap="round"/><path d="M803 180v20" stroke="#cb6a43" stroke-width="4"/><text x="815" y="193" font-size="12" fill="#52616a">без ореола</text><rect x="732" y="253" width="192" height="124" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="750" y="283" font-size="13" font-weight="700" fill="#256b62">СВЕТ И ТЕНЬ</text><circle cx="770" cy="320" r="12" fill="#f3ce71"/><path d="M789 320h31" stroke="#52616a" stroke-width="3"/><ellipse cx="866" cy="324" rx="27" ry="7" fill="#52616a" opacity=".45"/><text x="750" y="354" font-size="12" fill="#52616a">общий тон и направление</text></g>
  <rect x="36" y="398" width="888" height="74" rx="12" fill="#172c38"/><text x="58" y="428" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#f3ce71">ПЕРЕДАЧА</text><text x="58" y="454" font-family="Arial,sans-serif" font-size="15" fill="#fff">Слои остаются редактируемыми · размер и профиль сверяются с брифом · PSD и экспорт открываются повторно</text>
</svg>
