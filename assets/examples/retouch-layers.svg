<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Недеструктивные слои ретуши</title><desc id="desc">Исходная фотография, отдельный слой пыли, маска, корректирующий слой и проверка результата.</desc><rect width="720" height="360" fill="#f3f0e7"/><text x="38" y="42" font-family="Arial" font-size="16" font-weight="700" fill="#172c38">СЛОИ = КОНТРОЛЬ НАД ПРАВКАМИ</text><g font-family="Arial" font-size="13" fill="#172c38"><g transform="translate(64 85)"><rect width="146" height="190" fill="#fffdf7" stroke="#172c38"/><rect x="16" y="18" width="114" height="42" fill="#172c38"/><text x="28" y="44" fill="#fffdf7">01 · Исходник</text><rect x="16" y="68" width="114" height="42" fill="#fffdf7" stroke="#457f91"/><text x="28" y="94">02 · Маска</text><rect x="16" y="118" width="114" height="42" fill="#dcf17a"/><text x="28" y="144">03 · Цвет</text></g><path d="M224 178h52" stroke="#df563d" stroke-width="3"/><path d="m266 168 12 10-12 10" fill="none" stroke="#df563d" stroke-width="3"/><g transform="translate(294 93)"><rect width="360" height="170" fill="#fffdf7" stroke="#172c38"/><rect x="20" y="20" width="145" height="130" fill="#457f91"/><circle cx="92" cy="83" r="37" fill="#dcf17a"/><path d="M175 38h162M175 61h146M175 84h154" stroke="#172c38" stroke-width="6"/><text x="175" y="125" font-size="12">Сравни до / после</text><text x="20" y="160" font-size="12">Исходник остаётся доступен</text></g><text x="63" y="310" font-size="12">Маски прячут часть слоя, корректировки можно настроить повторно.</text></g></svg>
