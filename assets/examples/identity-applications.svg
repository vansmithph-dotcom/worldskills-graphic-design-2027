<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">От принципов айдентики к правилам применения</title>
  <desc id="desc">Инфографика показывает учебную систему вымышленной марки СЕВЕР: логотип и компактный вариант, палитру и типографику, затем применение на карточке, афише и упаковке. Подчёркнута необходимость правил, а не только эффектных мокапов.</desc>
  <rect width="1120" height="620" rx="28" fill="#f7f4ed"/>
  <text x="52" y="58" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#256b62">СИСТЕМА · ВЕРСИИ · ПРАВИЛА</text>
  <text x="52" y="108" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172c38">Айдентика — набор согласованных решений</text>
  <g transform="translate(52 145)" font-family="Arial,sans-serif">
    <rect width="1016" height="132" rx="18" fill="#172c38"/>
    <circle cx="77" cy="66" r="34" fill="#f3ce71"/><path d="M77 42 84 59 103 60 88 71 93 89 77 78 61 89 66 71 51 60 70 59Z" fill="#172c38"/>
    <text x="135" y="75" font-size="34" font-weight="700" letter-spacing="2" fill="#fff">СЕВЕР</text>
    <text x="556" y="54" font-size="16" font-weight="700" fill="#f3ce71">ОСНОВНОЙ ЗНАК</text>
    <text x="556" y="83" font-size="14" fill="#d2dade">Полное название + самостоятельный символ</text>
    <text x="800" y="54" font-size="16" font-weight="700" fill="#f3ce71">КОМПАКТНАЯ ВЕРСИЯ</text>
    <circle cx="872" cy="92" r="21" fill="#f3ce71"/><path d="M872 77 876 87 887 88 879 94 882 105 872 98 862 105 865 94 857 88 868 87Z" fill="#172c38"/>
  </g>
  <g transform="translate(52 305)" font-family="Arial,sans-serif">
    <text x="0" y="24" font-size="14" font-weight="700" fill="#256b62">ПРАВИЛА СИСТЕМЫ</text>
    <rect x="0" y="45" width="242" height="72" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><circle cx="38" cy="81" r="18" fill="#172c38"/><text x="70" y="77" font-size="14" font-weight="700" fill="#172c38">Цвет</text><text x="70" y="99" font-size="12" fill="#52616a">основа / акцент / фон</text>
    <rect x="258" y="45" width="242" height="72" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="282" y="91" font-size="28" font-weight="700" fill="#256b62">Aa</text><text x="340" y="77" font-size="14" font-weight="700" fill="#172c38">Типографика</text><text x="340" y="99" font-size="12" fill="#52616a">заголовок / текст</text>
    <rect x="516" y="45" width="242" height="72" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><path d="M542 92 562 65 582 92M542 78h40" fill="none" stroke="#cb6a43" stroke-width="5"/><text x="600" y="77" font-size="14" font-weight="700" fill="#172c38">Графический мотив</text><text x="600" y="99" font-size="12" fill="#52616a">форма / ритм / поля</text>
    <rect x="774" y="45" width="242" height="72" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><path d="M805 60h38v43h-38z" fill="#d9e8e2" stroke="#256b62" stroke-width="2"/><path d="M814 72h20M814 80h20M814 88h13" stroke="#256b62" stroke-width="3"/><text x="855" y="77" font-size="14" font-weight="700" fill="#172c38">Композиция</text><text x="855" y="99" font-size="12" fill="#52616a">поля / выравнивание</text>
  </g>
  <g transform="translate(52 470)" font-family="Arial,sans-serif">
    <text x="0" y="18" font-size="14" font-weight="700" fill="#256b62">ПРИМЕНИ И ПРОВЕРЬ</text>
    <rect x="0" y="37" width="300" height="86" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><rect x="20" y="50" width="49" height="60" fill="#d9e8e2"/><text x="81" y="72" font-size="14" font-weight="700" fill="#172c38">Карточка или документ</text><text x="81" y="96" font-size="12" fill="#52616a">проверка мелкого текста</text>
    <rect x="358" y="37" width="300" height="86" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><rect x="378" y="50" width="49" height="60" fill="#172c38"/><circle cx="402" cy="70" r="9" fill="#f3ce71"/><text x="439" y="72" font-size="14" font-weight="700" fill="#172c38">Афиша или экран</text><text x="439" y="96" font-size="12" fill="#52616a">проверка контраста</text>
    <rect x="716" y="37" width="300" height="86" rx="12" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><path d="M738 55h42v54h-42zM734 55h50l-6 12h-38z" fill="#cb6a43"/><text x="797" y="72" font-size="14" font-weight="700" fill="#172c38">Упаковка или изделие</text><text x="797" y="96" font-size="12" fill="#52616a">проверка панели и сборки</text>
  </g>
  <text x="52" y="600" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#b34f30">Гайд показывает, как работать с системой и что нельзя менять случайно.</text>
</svg>
