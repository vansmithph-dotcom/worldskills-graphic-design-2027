<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Комплект передачи проекта</title><desc id="desc">Четыре папки: исходник, связанные ресурсы, проверенный экспорт и контрольный список с версией.</desc><rect width="720" height="360" fill="#f3f0e7"/><text x="40" y="44" font-family="Arial" font-size="16" font-weight="700" fill="#172c38">ПЕРЕДАЙ ТАК, ЧТОБЫ МОЖНО БЫЛО ПРОДОЛЖИТЬ</text><g font-family="Arial" fill="#172c38"><g transform="translate(48 100)"><path d="M0 18h118l18 18h126v132H0Z" fill="#dcf17a" stroke="#172c38" stroke-width="2"/><text x="20" y="75" font-size="14" font-weight="700">01 · Исходник</text><text x="20" y="100" font-size="12">AI / PSD / INDD</text></g><g transform="translate(334 100)"><path d="M0 18h118l18 18h206v132H0Z" fill="#fffdf7" stroke="#172c38" stroke-width="2"/><text x="20" y="75" font-size="14" font-weight="700">02 · Связи и ресурсы</text><text x="20" y="100" font-size="12">изображения · шрифты*</text></g><g transform="translate(48 270)"><text x="0" y="0" font-size="12">03 · PDF повторно открыт и проверен</text></g><g transform="translate(382 270)"><text x="0" y="0" font-size="12">04 · Версия и чек-лист</text></g></g><text x="48" y="328" font-family="Arial" font-size="10" fill="#617078">*Перед передачей проверь права на включение внешнего ресурса.</text></svg>
