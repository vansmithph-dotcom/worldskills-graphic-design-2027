<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Шесть конструкций логотипа и примеры их сборки</title>
  <desc id="desc">Схема сравнивает словесный знак, монограмму, изобразительный знак, абстрактную форму, комбинированный знак и эмблему. Для каждого вымышленного бренда указано, какая часть несёт название и какая часть работает как самостоятельный знак.</desc>
  <rect width="1120" height="700" rx="28" fill="#f7f4ed"/>
  <text x="52" y="60" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#256b62">ТИП ВЫБИРАЙ ПО ЗАДАЧЕ, А НЕ ПО СПИСКУ</text>
  <text x="52" y="112" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172c38">Как может быть устроен логотип</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(52 150)"><rect width="318" height="220" rx="18" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="22" y="38" font-size="14" font-weight="700" fill="#256b62">1 · СЛОВЕСНЫЙ ЗНАК</text><text x="159" y="116" text-anchor="middle" font-size="36" font-weight="700" letter-spacing="2" fill="#172c38">ОРБИТА</text><path d="M76 148h166" stroke="#cb6a43" stroke-width="3"/><text x="22" y="190" font-size="13" fill="#52616a">Название читается полностью</text></g>
    <g transform="translate(401 150)"><rect width="318" height="220" rx="18" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="22" y="38" font-size="14" font-weight="700" fill="#256b62">2 · БУКВЕННЫЙ ЗНАК</text><circle cx="159" cy="115" r="47" fill="#d9e8e2"/><text x="159" y="129" text-anchor="middle" font-size="43" font-weight="700" fill="#256b62">О</text><text x="22" y="190" font-size="13" fill="#52616a">Монограмма или сокращение</text></g>
    <g transform="translate(750 150)"><rect width="318" height="220" rx="18" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="22" y="38" font-size="14" font-weight="700" fill="#256b62">3 · ИЗОБРАЗИТЕЛЬНЫЙ ЗНАК</text><path d="M159 70c-35 0-58 27-58 58 0 20 14 35 32 35 11 0 19-7 22-17 3 10 11 17 22 17 18 0 32-15 32-35 0-31-23-58-50-58Z" fill="#cb6a43"/><path d="M159 88v52" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="22" y="190" font-size="13" fill="#52616a">Узнаваемый предмет или образ</text></g>
    <g transform="translate(52 395)"><rect width="318" height="220" rx="18" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="22" y="38" font-size="14" font-weight="700" fill="#256b62">4 · АБСТРАКТНЫЙ ЗНАК</text><path d="M115 83 170 64 202 100 184 150 130 162 98 124Z" fill="#5e6ba7"/><circle cx="157" cy="115" r="20" fill="#f7f4ed"/><text x="22" y="190" font-size="13" fill="#52616a">Смысл задают форма и применение</text></g>
    <g transform="translate(401 395)"><rect width="318" height="220" rx="18" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="22" y="38" font-size="14" font-weight="700" fill="#256b62">5 · КОМБИНИРОВАННЫЙ ЗНАК</text><circle cx="110" cy="119" r="32" fill="#d9e8e2"/><path d="M110 94 117 112 137 113 121 125 126 144 110 133 94 144 99 125 83 113 103 112Z" fill="#256b62"/><text x="153" y="125" font-size="22" font-weight="700" fill="#172c38">ОРБИТА</text><text x="22" y="190" font-size="13" fill="#52616a">Знак и название работают вместе</text></g>
    <g transform="translate(750 395)"><rect width="318" height="220" rx="18" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><text x="22" y="38" font-size="14" font-weight="700" fill="#256b62">6 · ЭМБЛЕМА</text><path d="M112 69h94v67c0 28-47 51-47 51s-47-23-47-51Z" fill="#172c38"/><circle cx="159" cy="107" r="21" fill="#f3ce71"/><path d="M159 88 164 102 179 103 167 112 171 127 159 118 147 127 151 112 139 103 154 102Z" fill="#172c38"/><text x="22" y="204" font-size="13" fill="#52616a">Текст или знак внутри общей формы</text></g>
  </g>
  <text x="52" y="660" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b34f30">Проверь название, аудиторию, язык, размер и способ применения прежде, чем выбирать конструкцию.</text>
</svg>
