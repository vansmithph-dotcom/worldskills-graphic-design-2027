<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Три направления эскиза одной афиши</title>
  <desc id="desc">Три миниатюры афиши одной выставки используют разные композиционные идеи: крупную типографику, предметную метафору и маршрут посетителя. Для каждой указан отдельный вопрос быстрой проверки.</desc>
  <rect width="960" height="520" rx="24" fill="#f7f4ed"/><text x="36" y="55" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#256b62">БЫСТРЫЕ ЭСКИЗЫ · РАЗНЫЕ ЛОГИКИ</text><text x="36" y="98" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172c38">Один бриф — три направления</text>
  <g font-family="Arial,sans-serif"><g transform="translate(36 126)"><rect width="280" height="300" rx="14" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><rect x="20" y="20" width="240" height="188" rx="8" fill="#172c38"/><text x="38" y="55" font-size="13" font-weight="700" fill="#f3ce71">1 · ТИПОГРАФИКА</text><text x="38" y="112" font-size="32" font-weight="700" fill="#fff">НОЧЬ</text><text x="38" y="151" font-size="32" font-weight="700" fill="#fff">МУЗЕЯ</text><path d="M38 171h190" stroke="#cb6a43" stroke-width="4"/><text x="20" y="242" font-size="16" font-weight="700" fill="#172c38">Заголовок — главный образ</text><text x="20" y="271" font-size="13" fill="#52616a">Проверка: читается ли в 4:5?</text></g>
  <g transform="translate(340 126)"><rect width="280" height="300" rx="14" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><rect x="20" y="20" width="240" height="188" rx="8" fill="#d9e8e2"/><text x="38" y="55" font-size="13" font-weight="700" fill="#256b62">2 · МЕТАФОРА</text><circle cx="140" cy="120" r="50" fill="#cb6a43"/><path d="M102 143c24-47 51-47 76 0" fill="none" stroke="#fff" stroke-width="7"/><text x="140" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#172c38">НОЧЬ МУЗЕЯ</text><text x="20" y="242" font-size="16" font-weight="700" fill="#172c38">Предметный образ</text><text x="20" y="271" font-size="13" fill="#52616a">Проверка: смысл ясен без подписи?</text></g>
  <g transform="translate(644 126)"><rect width="280" height="300" rx="14" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><rect x="20" y="20" width="240" height="188" rx="8" fill="#f3ce71"/><text x="38" y="55" font-size="13" font-weight="700" fill="#172c38">3 · МАРШРУТ</text><g fill="#256b62"><rect x="42" y="78" width="42" height="32" rx="4"/><rect x="99" y="78" width="42" height="32" rx="4"/><rect x="156" y="78" width="42" height="32" rx="4"/><rect x="42" y="121" width="42" height="32" rx="4"/><rect x="99" y="121" width="42" height="32" rx="4"/><rect x="156" y="121" width="42" height="32" rx="4"/></g><path d="M63 159v22h142" fill="none" stroke="#cb6a43" stroke-width="4"/><text x="38" y="198" font-size="13" font-weight="700" fill="#172c38">ПУТЬ ПОСЕТИТЕЛЯ</text><text x="20" y="242" font-size="16" font-weight="700" fill="#172c38">Последовательность</text><text x="20" y="271" font-size="13" fill="#52616a">Проверка: заметен ли следующий шаг?</text></g></g>
  <rect x="36" y="448" width="888" height="46" rx="10" fill="#e7eee9"/><text x="56" y="477" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#172c38">Сравни ясность, отличие от соседних идей и пригодность для печати и экрана.</text>
</svg>
