<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Зоны печатной подготовки</title><desc id="desc">Схема показывает фон за линией реза, линию реза и внутреннюю безопасную область с текстом.</desc><rect width="720" height="360" fill="#f3f0e7"/><text x="40" y="42" font-family="Arial" font-size="16" font-weight="700" fill="#172c38">ПРОВЕРЬ ПО СПЕЦИФИКАЦИИ</text><rect x="185" y="73" width="350" height="235" fill="#df563d"/><rect x="205" y="90" width="310" height="202" fill="#fffdf7" stroke="#172c38" stroke-width="2"/><rect x="230" y="111" width="260" height="160" fill="none" stroke="#457f91" stroke-width="2" stroke-dasharray="7 5"/><text x="224" y="161" font-family="Arial" font-size="16" font-weight="700" fill="#172c38">ВАЖНОЕ СООБЩЕНИЕ</text><path d="M548 73h58" stroke="#df563d" stroke-width="2"/><text x="612" y="78" font-family="Arial" font-size="12" fill="#172c38">вылет по</text><text x="612" y="94" font-family="Arial" font-size="12" fill="#172c38">заданию</text><path d="M519 90h88" stroke="#172c38" stroke-width="2"/><text x="612" y="122" font-family="Arial" font-size="12" fill="#172c38">линия реза</text><path d="M492 111h114" stroke="#457f91" stroke-width="2"/><text x="612" y="151" font-family="Arial" font-size="12" fill="#172c38">безопасная</text><text x="612" y="167" font-family="Arial" font-size="12" fill="#172c38">область</text><text x="40" y="335" font-family="Arial" font-size="12" fill="#617078">Схематично: конкретные расстояния и линии берутся из брифа или шаблона типографии.</text></svg>
