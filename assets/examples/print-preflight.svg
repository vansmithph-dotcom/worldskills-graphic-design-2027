<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Развёртка рукава «Пробный лист»</title><desc id="desc">Размерные панели 100, 25, 100, 25 и 12 миллиметров; сплошная линия обозначает рез, штриховая — сгиб, отмечены внешний вылет 3 миллиметра и безопасная зона 5 миллиметров.</desc><style>.bg{fill:#f3f0e7}.paper{fill:#fffdf7}.ink{fill:#172c38}.muted{fill:#5e6d72}.cut{stroke:#b13d2e;stroke-width:3}.fold{stroke:#276b79;stroke-width:3;stroke-dasharray:10 7}.safe{fill:none;stroke:#8a6e9c;stroke-width:2;stroke-dasharray:5 5}.label{font:700 17px Arial,sans-serif}.small{font:700 14px Arial,sans-serif}.tiny{font:13px Arial,sans-serif}</style><rect class="bg" width="1080" height="520"/><text x="44" y="48" class="ink label">УЧЕБНАЯ СПЕЦИФИКАЦИЯ · «ПРОБНЫЙ ЛИСТ»</text><text x="44" y="80" class="muted small">Рукав для блока 100 × 65 × 25 мм · все размеры здесь — условия одного задания</text><rect x="80" y="144" width="920" height="244" fill="#dce8df"/><rect x="90" y="154" width="900" height="224" rx="2" fill="#eadcc6" stroke="#b13d2e" stroke-width="3"/><rect x="107" y="171" width="866" height="190" class="safe"/><path d="M434 154v224M520 154v224M863 154v224M949 154v224" class="fold"/><text x="115" y="215" class="ink label">ЛИЦЕВАЯ</text><text x="115" y="244" class="muted small">100 мм</text><text x="441" y="215" class="ink small">БОК</text><text x="441" y="244" class="muted small">25</text><text x="540" y="215" class="ink label">ЗАДНЯЯ</text><text x="540" y="244" class="muted small">100 мм</text><text x="866" y="215" class="ink small">БОК</text><text x="866" y="244" class="muted small">25</text><text x="951" y="215" class="ink small">КЛЕЙ</text><text x="951" y="244" class="muted small">12</text><path d="M90 414h900M90 405v18M990 405v18" class="cut"/><text x="482" y="445" class="ink small">262 мм до реза</text><path d="M55 154h-14v224h14" class="cut"/><text x="27" y="280" class="ink small" transform="rotate(-90 27 280)">65 мм</text><rect x="90" y="468" width="18" height="5" class="cut"/><text x="116" y="477" class="ink small">Рез — сплошная</text><path d="M322 471h25" class="fold"/><text x="357" y="477" class="ink small">Сгиб — штриховая</text><rect x="585" y="466" width="19" height="14" class="safe"/><text x="612" y="477" class="ink small">Безопасно для текста — 5 мм внутрь</text><text x="44" y="509" class="muted tiny">Внешний вылет 3 мм показан за контуром реза; реальные параметры уточняются у фактического поставщика.</text></svg>