<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Карта требований брифа</title><desc id="desc">Четыре связанных блока: цель и аудитория, обязательное содержание, форматы, проверка сдачи.</desc><rect width="720" height="360" fill="#f3f0e7"/><path d="M40 40h640v280H40z" fill="none" stroke="#172c38" stroke-width="2"/><text x="64" y="80" font-family="Arial" font-size="16" fill="#172c38" font-weight="700">БРИФ → ПРОВЕРЯЕМЫЕ РЕШЕНИЯ</text><g font-family="Arial" fill="#172c38"><rect x="64" y="112" width="254" height="76" fill="#dcf17a"/><text x="82" y="143" font-size="14" font-weight="700">01 · Цель и аудитория</text><text x="82" y="166" font-size="12">Что должен понять человек?</text><rect x="402" y="112" width="254" height="76" fill="#fffdf7" stroke="#172c38"/><text x="420" y="143" font-size="14" font-weight="700">02 · Обязательное</text><text x="420" y="166" font-size="12">Сообщение, элементы, ограничения</text><rect x="64" y="214" width="254" height="76" fill="#fffdf7" stroke="#172c38"/><text x="82" y="245" font-size="14" font-weight="700">03 · Форматы</text><text x="82" y="268" font-size="12">Размеры, носители, срок</text><rect x="402" y="214" width="254" height="76" fill="#457f91"/><text x="420" y="245" font-size="14" font-weight="700" fill="#fffdf7">04 · Проверка сдачи</text><text x="420" y="268" font-size="12" fill="#fffdf7">Как докажу, что готово?</text></g></svg>
