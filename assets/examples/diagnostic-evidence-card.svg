<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Карта диагностики: действие, доказательство, следующий шаг</title>
  <desc id="desc">Три одинаковые пробы — чтение брифа, сборка страницы и экспорт — связываются с наблюдаемым файлом или проверкой и конкретным повторным упражнением. Итог хранится приватно.</desc>
  <rect width="960" height="470" rx="24" fill="#f7f4ed"/><text x="36" y="55" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#256b62">ДЕЙСТВИЕ → ДОКАЗАТЕЛЬСТВО → ПЛАН</text><text x="36" y="98" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172c38">Диагностируй то, что показано в работе</text>
  <g font-family="Arial,sans-serif"><rect x="36" y="122" width="888" height="50" rx="10" fill="#172c38"/><text x="58" y="154" font-size="13" font-weight="700" fill="#f3ce71">ПРОБА</text><text x="330" y="154" font-size="13" font-weight="700" fill="#f3ce71">ДОКАЗАТЕЛЬСТВО</text><text x="650" y="154" font-size="13" font-weight="700" fill="#f3ce71">СЛЕДУЮЩЕЕ УПРАЖНЕНИЕ</text>
  <g font-size="14"><rect x="36" y="184" width="888" height="65" rx="10" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><circle cx="64" cy="216" r="15" fill="#d9e8e2"/><text x="64" y="221" text-anchor="middle" font-weight="700" fill="#256b62">1</text><text x="90" y="221" font-weight="700" fill="#172c38">Прочитать бриф</text><text x="330" y="210" fill="#52616a">Карта требований;</text><text x="330" y="232" fill="#52616a">неразрешённый вопрос</text><text x="650" y="210" fill="#52616a">Выделить must / should;</text><text x="650" y="232" fill="#52616a">сверить числовые данные</text>
  <rect x="36" y="260" width="888" height="65" rx="10" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><circle cx="64" cy="292" r="15" fill="#d9e8e2"/><text x="64" y="297" text-anchor="middle" font-weight="700" fill="#256b62">2</text><text x="90" y="297" font-weight="700" fill="#172c38">Собрать страницу</text><text x="330" y="286" fill="#52616a">Читаемость главного</text><text x="330" y="308" fill="#52616a">сообщения в макете</text><text x="650" y="286" fill="#52616a">Сделать три варианта;</text><text x="650" y="308" fill="#52616a">проверить миниатюру</text>
  <rect x="36" y="336" width="888" height="65" rx="10" fill="#fff" stroke="#d6d5cc" stroke-width="2"/><circle cx="64" cy="368" r="15" fill="#d9e8e2"/><text x="64" y="373" text-anchor="middle" font-weight="700" fill="#256b62">3</text><text x="90" y="373" font-weight="700" fill="#172c38">Экспортировать</text><text x="330" y="362" fill="#52616a">Файл открыт повторно;</text><text x="330" y="384" fill="#52616a">размер сверен с брифом</text><text x="650" y="362" fill="#52616a">Повторить экспорт;</text><text x="650" y="384" fill="#52616a">проверить профиль и имя</text></g></g>
  <rect x="36" y="419" width="888" height="32" rx="8" fill="#e7eee9"/><text x="53" y="441" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#172c38">Два учебных приоритета · артефакт для проверки · дата повторной пробы · личное хранение</text>
</svg>
