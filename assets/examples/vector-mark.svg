<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Знак на построительной сетке</title><desc id="desc">Три геометрические формы образуют простой абстрактный знак; оси и окружности показывают построение.</desc><rect width="720" height="360" fill="#f3f0e7"/><g stroke="#172c38" stroke-opacity=".14"><path d="M50 60H670M50 110H670M50 160H670M50 210H670M50 260H670M50 310H670M100 40V330M150 40V330M200 40V330M250 40V330M300 40V330M350 40V330M400 40V330M450 40V330M500 40V330M550 40V330M600 40V330M650 40V330"/></g><circle cx="360" cy="180" r="115" fill="none" stroke="#457f91" stroke-width="2" stroke-dasharray="7 7"/><path d="M360 65V295M245 180H475" stroke="#df563d" stroke-width="2"/><path d="M360 100L430 220H290Z" fill="#dcf17a" stroke="#172c38" stroke-width="4" stroke-linejoin="round"/><circle cx="360" cy="170" r="26" fill="#df563d" stroke="#172c38" stroke-width="4"/><text x="50" y="340" font-family="Arial" font-size="13" fill="#172c38">Оптический центр и чистые кривые проверяются в нескольких размерах.</text></svg>
